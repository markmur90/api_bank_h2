{% extends 'base.html' %}
{% block title %}Usuario{% endblock %}
{% block content %}
<h1 class="mb-4">{{ create|yesno:'Nuevo Usuario,Editar Usuario' }}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Guardar</button>
  <a href="{% url 'user_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
