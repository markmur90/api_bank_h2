{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h1 class="mb-4">Eliminar Deudor</h1>
  <p>¿Estás seguro de que deseas eliminar a {{ object.name }}?</p>
  <form method="post">
    {% csrf_token %}
    <a href="{% url 'list_debtorsGPT4' %}" class="btn btn-secondary">Cancelar</a>
    <button type="submit" class="btn btn-danger">Eliminar</button>
  </form>
</div>
{% endblock %}
