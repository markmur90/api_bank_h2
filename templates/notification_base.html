{% extends 'base.html' %}
{% load static %}

{% block title %}Notificaciones - API BanK{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h2 class="mb-0">
                        <i class="bi bi-bell me-2"></i>
                        Centro de Notificaciones
                    </h2>
                    <div>
                        <button class="btn btn-outline-light btn-sm" onclick="markAllAsRead()">
                            <i class="bi bi-check-all me-1"></i>
                            Marcar todo como leído
                        </button>
                        <button class="btn btn-outline-light btn-sm" onclick="refreshNotifications()">
                            <i class="bi bi-arrow-clockwise me-1"></i>
                            Actualizar
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <!-- Filtros -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-outline-primary active" data-filter="all">
                                    Todas
                                </button>
                                <button type="button" class="btn btn-outline-success" data-filter="success">
                                    <i class="bi bi-check-circle me-1"></i>
                                    Éxito
                                </button>
                                <button type="button" class="btn btn-outline-warning" data-filter="warning">
                                    <i class="bi bi-exclamation-triangle me-1"></i>
                                    Advertencia
                                </button>
                                <button type="button" class="btn btn-outline-danger" data-filter="error">
                                    <i class="bi bi-x-circle me-1"></i>
                                    Error
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6 text-end">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="autoRefresh" checked>
                                <label class="form-check-label" for="autoRefresh">
                                    Auto-actualizar
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Lista de Notificaciones -->
                    <div id="notificationsList">
                        <!-- Las notificaciones se cargarán dinámicamente -->
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                            <p class="mt-2">Cargando notificaciones...</p>
                        </div>
                    </div>

                    <!-- Paginación -->
                    <nav aria-label="Navegación de notificaciones" class="mt-3">
                        <ul class="pagination justify-content-center" id="pagination">
                            <!-- La paginación se generará dinámicamente -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Template para notificaciones individuales -->
<template id="notificationTemplate">
    <div class="notification-item border-bottom py-3" data-type="">
        <div class="row align-items-center">
            <div class="col-md-1 text-center">
                <div class="notification-icon">
                    <i class="bi bi-info-circle text-primary"></i>
                </div>
            </div>
            <div class="col-md-8">
                <h6 class="notification-title mb-1"></h6>
                <p class="notification-message mb-1 text-muted"></p>
                <small class="text-muted">
                    <i class="bi bi-clock me-1"></i>
                    <span class="notification-time"></span>
                </small>
            </div>
            <div class="col-md-3 text-end">
                <div class="btn-group btn-group-sm">
                    <button class="btn btn-outline-primary btn-mark-read" title="Marcar como leído">
                        <i class="bi bi-check"></i>
                    </button>
                    <button class="btn btn-outline-danger btn-delete" title="Eliminar">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</template>

<style>
.notification-item {
    transition: background-color 0.3s ease;
}

.notification-item:hover {
    background-color: #f8f9fa;
}

.notification-item.unread {
    background-color: #e3f2fd;
    border-left: 4px solid #2196f3;
}

.notification-item.success {
    border-left: 4px solid #4caf50;
}

.notification-item.warning {
    border-left: 4px solid #ff9800;
}

.notification-item.error {
    border-left: 4px solid #f44336;
}

.notification-icon {
    font-size: 1.5rem;
}

.notification-title {
    font-weight: 600;
}

.notification-message {
    font-size: 0.9rem;
}

.btn-group-sm .btn {
    padding: 0.25rem 0.5rem;
    font-size: 0.875rem;
}
</style>

<script>
// Variables globales
let currentPage = 1;
let currentFilter = 'all';
let autoRefreshInterval;

// Inicialización
document.addEventListener('DOMContentLoaded', function() {
    loadNotifications();
    setupEventListeners();
    startAutoRefresh();
});

// Configurar event listeners
function setupEventListeners() {
    // Filtros
    document.querySelectorAll('[data-filter]').forEach(button => {
        button.addEventListener('click', function() {
            const filter = this.dataset.filter;
            setActiveFilter(filter);
            currentFilter = filter;
            currentPage = 1;
            loadNotifications();
        });
    });

    // Auto-refresh toggle
    document.getElementById('autoRefresh').addEventListener('change', function() {
        if (this.checked) {
            startAutoRefresh();
        } else {
            stopAutoRefresh();
        }
    });
}

// Cargar notificaciones
function loadNotifications() {
    const container = document.getElementById('notificationsList');
    container.innerHTML = `
        <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-2">Cargando notificaciones...</p>
        </div>
    `;

    // Simular carga de datos (reemplazar con llamada AJAX real)
    setTimeout(() => {
        const notifications = getMockNotifications();
        renderNotifications(notifications);
    }, 1000);
}

// Obtener notificaciones de ejemplo
function getMockNotifications() {
    return [
        {
            id: 1,
            type: 'success',
            title: 'Transferencia Exitosa',
            message: 'La transferencia SEPA-2025-001 ha sido procesada correctamente.',
            time: '2025-01-15 14:30:00',
            unread: true
        },
        {
            id: 2,
            type: 'warning',
            title: 'Conexión Inestable',
            message: 'Se detectaron problemas de conectividad con el servidor bancario.',
            time: '2025-01-15 13:45:00',
            unread: true
        },
        {
            id: 3,
            type: 'error',
            title: 'Error de Autenticación',
            message: 'Falló la autenticación OAuth2. Verifique sus credenciales.',
            time: '2025-01-15 12:20:00',
            unread: false
        },
        {
            id: 4,
            type: 'success',
            title: 'Sistema Actualizado',
            message: 'El sistema ha sido actualizado a la versión 2.1.0.',
            time: '2025-01-15 10:15:00',
            unread: false
        }
    ];
}

// Renderizar notificaciones
function renderNotifications(notifications) {
    const container = document.getElementById('notificationsList');
    const template = document.getElementById('notificationTemplate');
    
    if (notifications.length === 0) {
        container.innerHTML = `
            <div class="text-center py-4">
                <i class="bi bi-bell-slash text-muted" style="font-size: 3rem;"></i>
                <p class="mt-2 text-muted">No hay notificaciones para mostrar</p>
            </div>
        `;
        return;
    }

    container.innerHTML = '';
    
    notifications.forEach(notification => {
        if (currentFilter !== 'all' && notification.type !== currentFilter) {
            return;
        }

        const clone = template.content.cloneNode(true);
        const item = clone.querySelector('.notification-item');
        
        // Configurar tipo y clase
        item.dataset.type = notification.type;
        if (notification.unread) {
            item.classList.add('unread');
        }
        item.classList.add(notification.type);

        // Configurar contenido
        item.querySelector('.notification-title').textContent = notification.title;
        item.querySelector('.notification-message').textContent = notification.message;
        item.querySelector('.notification-time').textContent = formatTime(notification.time);

        // Configurar icono según tipo
        const icon = item.querySelector('.notification-icon i');
        icon.className = getIconClass(notification.type);

        // Configurar botones
        item.querySelector('.btn-mark-read').addEventListener('click', () => markAsRead(notification.id));
        item.querySelector('.btn-delete').addEventListener('click', () => deleteNotification(notification.id));

        container.appendChild(clone);
    });
}

// Obtener clase de icono según tipo
function getIconClass(type) {
    const icons = {
        'success': 'bi bi-check-circle text-success',
        'warning': 'bi bi-exclamation-triangle text-warning',
        'error': 'bi bi-x-circle text-danger',
        'info': 'bi bi-info-circle text-primary'
    };
    return icons[type] || icons.info;
}

// Formatear tiempo
function formatTime(timeString) {
    const date = new Date(timeString);
    const now = new Date();
    const diff = now - date;
    
    if (diff < 60000) { // menos de 1 minuto
        return 'Ahora mismo';
    } else if (diff < 3600000) { // menos de 1 hora
        const minutes = Math.floor(diff / 60000);
        return `Hace ${minutes} minuto${minutes > 1 ? 's' : ''}`;
    } else if (diff < 86400000) { // menos de 1 día
        const hours = Math.floor(diff / 3600000);
        return `Hace ${hours} hora${hours > 1 ? 's' : ''}`;
    } else {
        return date.toLocaleDateString('es-ES', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }
}

// Marcar como leído
function markAsRead(id) {
    // Aquí iría la llamada AJAX para marcar como leído
    console.log(`Marcando como leído: ${id}`);
    showToast('Notificación marcada como leída', 'success');
    loadNotifications(); // Recargar para actualizar estado
}

// Eliminar notificación
function deleteNotification(id) {
    if (confirm('¿Está seguro de que desea eliminar esta notificación?')) {
        // Aquí iría la llamada AJAX para eliminar
        console.log(`Eliminando notificación: ${id}`);
        showToast('Notificación eliminada', 'success');
        loadNotifications(); // Recargar para actualizar estado
    }
}

// Marcar todas como leídas
function markAllAsRead() {
    // Aquí iría la llamada AJAX para marcar todas como leídas
    console.log('Marcando todas como leídas');
    showToast('Todas las notificaciones marcadas como leídas', 'success');
    loadNotifications(); // Recargar para actualizar estado
}

// Actualizar notificaciones
function refreshNotifications() {
    loadNotifications();
    showToast('Notificaciones actualizadas', 'info');
}

// Configurar filtro activo
function setActiveFilter(filter) {
    document.querySelectorAll('[data-filter]').forEach(button => {
        button.classList.remove('active');
    });
    document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
}

// Auto-refresh
function startAutoRefresh() {
    autoRefreshInterval = setInterval(() => {
        loadNotifications();
    }, 30000); // Actualizar cada 30 segundos
}

function stopAutoRefresh() {
    if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
    }
}

// Mostrar toast
function showToast(message, type = 'info') {
    // Crear toast dinámicamente
    const toast = document.createElement('div');
    toast.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
    toast.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
    toast.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
    
    document.body.appendChild(toast);
    
    // Auto-remover después de 3 segundos
    setTimeout(() => {
        if (toast.parentNode) {
            toast.remove();
        }
    }, 3000);
}

// Exponer funciones globalmente
window.markAllAsRead = markAllAsRead;
window.refreshNotifications = refreshNotifications;
</script>
{% endblock %}
